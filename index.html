<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ahmed's Socials</title>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: white;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    /* Title */
    h1 {
      font-size: 38px;
      color: #111;
      margin-bottom: 8px;
    }

    /* Subtitle */
    .subtitle {
      color: #777;
      font-size: 16px;
      margin-bottom: 30px;
    }

    /* Social buttons */
    .social-button {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 12px;

      padding: 16px;
      margin: 15px 0;

      border-radius: 14px;

      text-decoration: none;

      font-size: 18px;
      font-weight: bold;

      transition: transform 0.2s ease,
                  opacity 0.2s ease,
                  box-shadow 0.2s ease;
    }

    .social-button:hover {
      transform: translateY(-3px);
      opacity: 0.92;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
    }

    .social-button:active {
      transform: scale(0.97);
    }

    .social-button i {
      font-size: 24px;
    }


    /* =========================
       INSTAGRAM
       ========================= */

    .instagram {
      color: white;

      background: linear-gradient(
        45deg,
        #feda75,
        #fa7e1e,
        #d62976,
        #962fbf,
        #4f5bd5
      );
    }


    /* =========================
       SNAPCHAT
       ========================= */

    .snapchat {
      background: #fffc00;
      color: #111;
    }

    /* Only the Snapchat logo is white */
    .snapchat i {
      color: white;

      /* Dark outline so the white logo is visible */
      -webkit-text-stroke: 1.5px #111;

      text-shadow:
        0 0 1px #111;
    }


    /* =========================
       WHATSAPP
       ========================= */

    .whatsapp {
      background: #25D366;
      color: white;
    }


    /* Footer */
    .footer {
      margin-top: 30px;

      color: #aaa;

      font-size: 13px;
    }


    /* Mobile */
    @media (max-width: 480px) {

      h1 {
        font-size: 32px;
      }

      .social-button {
        font-size: 17px;
        padding: 15px;
      }

    }

  </style>
</head>

<body>

  <div class="container">

    <!-- ONE TITLE ONLY -->
    <h1>Ahmed's Socials</h1>

    <p class="subtitle">
      Connect with me
    </p>


    <!-- INSTAGRAM -->
    <a
      class="social-button instagram"
      href="https://www.instagram.com/a7med_mo7amed2012?stkn=MzQzNGw4bno5M2pz"
      target="_blank"
      rel="noopener noreferrer">

      <i class="fa-brands fa-instagram"></i>

      Instagram

    </a>


    <!-- SNAPCHAT -->
    <a
      class="social-button snapchat"
      href="https://www.snapchat.com/add/ahmedmoh3652?share_id=sAJipEOCF0A&locale=en-EG"
      target="_blank"
      rel="noopener noreferrer">

      <i class="fa-brands fa-snapchat"></i>

      Snapchat

    </a>


    <!-- WHATSAPP -->
    <!-- Your phone number is hidden inside the link -->
    <a
      class="social-button whatsapp"
      href="https://wa.me/201207623343"
      target="_blank"
      rel="noopener noreferrer">

      <i class="fa-brands fa-whatsapp"></i>

      WhatsApp — @A7madMohamed

    </a>


    <!-- FOOTER -->
    <div class="footer">
      © 2026 Ahmed
    </div>

  </div>

</body>
</html>
